[project]
name = "backend"
version = "0.1.0"
description = "Tone Checker — Laya decision backend"
readme = "README.md"
authors = [
    { name = "Akmal", email = "akmalmuzayyinzulfa309@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "laya[serve]",
    "huggingface-hub",
]

[project.scripts]
backend = "backend.main:run"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
